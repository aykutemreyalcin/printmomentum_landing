name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_S3_BUCKET: printmomentum-prod-use1-053285355718
  EC2_INSTANCE_ID: i-0a6c1950651c0bc11

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload landing to S3
        run: |
          aws s3 sync . "s3://${AWS_S3_BUCKET}/host/landing/" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"
      - name: Sync landing on EC2
        run: |
          set -euo pipefail
          PARAMS=$(mktemp)
          python3 <<'PY' > "$PARAMS"
          import json
          bucket = "${{ env.AWS_S3_BUCKET }}"
          print(json.dumps({"commands": [
            "set -euo pipefail",
            "install -d -m 755 /opt/printmomentum/landing",
            f"aws s3 sync s3://{bucket}/host/landing/ /opt/printmomentum/landing --delete",
          ]}))
          PY
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "file://$PARAMS" \
            --query Command.CommandId --output text)
          rm -f "$PARAMS"
          for _ in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status --output text)
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Verify public landing
        run: curl -sf -o /dev/null "https://printmomentum.com/"
